---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: attestationevidences.aiops.imperium.io
spec:
  group: aiops.imperium.io
  names:
    kind: AttestationEvidence
    listKind: AttestationEvidenceList
    plural: attestationevidences
    shortNames:
    - aevid
    singular: attestationevidence
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              digest:
                description: Digest identifies the immutable evidence digest.
                type: string
              evidenceType:
                description: EvidenceType identifies the attestation domain.
                enum:
                - cpu
                - gpu
                - runtime
                - composite
                type: string
              evidenceURI:
                description: EvidenceURI points to the externally stored attestation
                  payload.
                type: string
              freshness:
                description: Freshness constrains maximum age and simulated mode.
                properties:
                  maxAgeSeconds:
                    description: MaxAgeSeconds is the maximum accepted age.
                    format: int32
                    minimum: 1
                    type: integer
                  simulated:
                    description: Simulated indicates evidence was generated by the
                      local kind simulator.
                    type: boolean
                required:
                - maxAgeSeconds
                type: object
              policyRef:
                description: PolicyRef optionally ties evidence to a confidentiality
                  policy.
                properties:
                  name:
                    description: Name of the referenced object.
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace of the referenced object. Defaults to the
                      owner namespace.
                    type: string
                required:
                - name
                type: object
              runtime:
                description: Runtime captures the expected runtime class and simulation
                  flag.
                properties:
                  runtimeClassName:
                    description: RuntimeClassName is the runtime class expected by
                      policy.
                    type: string
                  simulated:
                    description: Simulated indicates the runtime class is a kind-safe
                      simulated mapping.
                    type: boolean
                type: object
              signatures:
                description: Signatures lists detached or envelope signatures.
                items:
                  type: string
                type: array
              simulated:
                description: Simulated makes local kind evidence explicit.
                type: boolean
              subjectRef:
                description: SubjectRef identifies the workload, node, device or runtime
                  being attested.
                properties:
                  name:
                    description: Name of the referenced object.
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace of the referenced object. Defaults to the
                      owner namespace.
                    type: string
                required:
                - name
                type: object
              tee:
                description: TEE identifies the attested trusted execution environment.
                enum:
                - TDX
                - SEV-SNP
                - none
                type: string
            required:
            - evidenceType
            - freshness
            - subjectRef
            - tee
            type: object
          status:
            properties:
              attestationType:
                description: AttestationType records the attestation flow (guest-attestation|simulated).
                type: string
              claimsDigest:
                description: ClaimsDigest is a canonical digest of the verified attestation
                  claims.
                type: string
              conditions:
                description: Conditions captures readiness and verification state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              evidenceMode:
                description: |-
                  EvidenceMode is "real" only after genuine attestation verification,
                  "simulated" in kind/dev, "unverified" when verification could not run.
                enum:
                - real
                - simulated
                - unverified
                type: string
              expiresAt:
                format: date-time
                type: string
              failureReason:
                description: FailureReason explains a Failed/Unavailable verification.
                type: string
              freshnessSeconds:
                description: FreshnessSeconds is the accepted freshness window in
                  seconds.
                format: int64
                type: integer
              issuedAt:
                description: IssuedAt / ExpiresAt bound the validity window derived
                  from the claims.
                format: date-time
                type: string
              lastVerifiedTime:
                description: LastVerifiedTime is the last successful verification
                  time.
                format: date-time
                type: string
              maaTokenHash:
                description: MAATokenHash is the SHA-256 of the raw MAA/guest-attestation
                  token.
                type: string
              nodeUID:
                description: NodeUID binds the evidence to a concrete node object
                  UID.
                type: string
              nonce:
                description: Nonce echoes the freshness nonce that was verified.
                type: string
              observedGeneration:
                description: ObservedGeneration is the last generation observed by
                  a controller.
                format: int64
                type: integer
              provider:
                description: Provider is the attestation provider actually used (maa|simulator).
                type: string
              revoked:
                description: Revoked indicates the evidence has been invalidated.
                type: boolean
              verificationStatus:
                description: VerificationStatus is Verified|Failed|Unavailable.
                enum:
                - Verified
                - Failed
                - Unavailable
                type: string
              verified:
                description: Verified indicates the latest verification outcome.
                type: boolean
              verifiedBy:
                description: VerifiedBy names the verifier controller identity that
                  produced this status.
                type: string
              verifierPodUID:
                description: VerifierPodUID is the pod UID of the verifier that wrote
                  this status.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
