---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: rawattestationreports.aiops.imperium.io
spec:
  group: aiops.imperium.io
  names:
    kind: RawAttestationReport
    listKind: RawAttestationReportList
    plural: rawattestationreports
    shortNames:
    - rar
    singular: rawattestationreport
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.nodeName
      name: Node
      type: string
    - jsonPath: .spec.provider
      name: Provider
      type: string
    - jsonPath: .status.processed
      name: Processed
      type: boolean
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: RawAttestationReport is the untrusted, agent-produced attestation
          material.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              RawAttestationReportSpec is written by the node-attestation-agent running on a
              confidential node. It carries ONLY the raw, unverified attestation material.
              The agent has NO permission to write AttestationEvidence — that is exclusively
              the central verifier's job (trust-chain separation, gate G0).
            properties:
              agentPodUID:
                description: AgentPodUID / AgentServiceAccount identify the collecting
                  agent for audit.
                type: string
              agentServiceAccount:
                type: string
              collectedAt:
                description: CollectedAt is when the agent collected the report.
                format: date-time
                type: string
              nodeName:
                description: NodeName is the node the agent is running on.
                minLength: 1
                type: string
              nodeUID:
                description: NodeUID is the node object UID as observed by the agent.
                type: string
              nonce:
                description: Nonce is the freshness nonce the agent embedded in the
                  attestation request.
                type: string
              provider:
                description: Provider identifies the attestation source (maa|simulator).
                enum:
                - maa
                - simulator
                type: string
              rawToken:
                description: |-
                  RawToken is the raw MAA / guest-attestation token (JWT) as collected.
                  It is UNVERIFIED. The verifier is responsible for validating it.
                type: string
              rawTokenHash:
                description: RawTokenHash is the SHA-256 of RawToken, for tamper-evidence
                  in logs.
                type: string
              simulated:
                description: Simulated marks kind/dev reports that must never become
                  real evidence.
                type: boolean
            required:
            - collectedAt
            - nodeName
            - provider
            type: object
          status:
            properties:
              conditions:
                description: Conditions captures processing state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              evidenceRef:
                description: EvidenceRef names the AttestationEvidence produced from
                  this report, if any.
                type: string
              observedGeneration:
                description: ObservedGeneration is the last generation observed by
                  the verifier.
                format: int64
                type: integer
              processed:
                description: Processed indicates the verifier has consumed this report.
                type: boolean
              verificationStatus:
                description: VerificationStatus mirrors the verifier outcome (Verified|Failed|Unavailable).
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
