---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: confidentialinferencepolicies.aiops.imperium.io
spec:
  group: aiops.imperium.io
  names:
    kind: ConfidentialInferencePolicy
    listKind: ConfidentialInferencePolicyList
    plural: confidentialinferencepolicies
    shortNames:
    - cip
    singular: confidentialinferencepolicy
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              allowedRuntimeClasses:
                description: AllowedRuntimeClasses lists allowed runtime classes in
                  production.
                items:
                  type: string
                type: array
              audit:
                description: Audit controls evidence/audit requirements.
                properties:
                  level:
                    description: Level controls the amount of detail retained.
                    enum:
                    - summary
                    - full
                    type: string
                  required:
                    description: Required means the policy must emit auditable records.
                    type: boolean
                type: object
              enforcementMode:
                description: EnforcementMode controls policy behavior.
                enum:
                - warn
                - enforce
                - audit
                type: string
              gpu:
                description: GPU describes the expected confidential GPU properties.
                properties:
                  deviceClass:
                    description: DeviceClass identifies the requested class or profile.
                    type: string
                  draClass:
                    description: DRAClass is the future DRA class name expected in
                      production clusters.
                    type: string
                  vendor:
                    description: Vendor identifies the GPU vendor or stack.
                    enum:
                    - nvidia
                    - amd
                    - intel
                    type: string
                type: object
              keyRelease:
                description: KeyRelease governs conditional key release.
                properties:
                  required:
                    description: Required requires a successful key-release check
                      before execution.
                    type: boolean
                  ttlSeconds:
                    description: TTLSeconds bounds the validity window of a release
                      decision.
                    format: int32
                    minimum: 0
                    type: integer
                type: object
              maxEvidenceAgeSeconds:
                description: MaxEvidenceAgeSeconds is the freshness limit for attestation
                  evidence.
                format: int32
                minimum: 1
                type: integer
              requireConfidentialContainers:
                description: RequireConfidentialContainers requires a confidential
                  runtime class.
                type: boolean
              requireConfidentialGPU:
                description: RequireConfidentialGPU requires the GPU section and future
                  DRA integration.
                type: boolean
              requireImageDigest:
                description: RequireImageDigest requires image references to be digest-pinned.
                type: boolean
              requireModelDigest:
                description: RequireModelDigest requires an immutable model digest
                  annotation.
                type: boolean
              requiredTEE:
                description: RequiredTEE enumerates accepted trusted-execution environments.
                items:
                  enum:
                  - TDX
                  - SEV-SNP
                  type: string
                minItems: 1
                type: array
              target:
                description: Target selects namespaces/workloads protected by the
                  policy.
                properties:
                  namespaceSelector:
                    description: NamespaceSelector selects target namespaces.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                  workloadSelector:
                    description: WorkloadSelector selects workloads or pods inside
                      matching namespaces.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                type: object
            required:
            - enforcementMode
            - maxEvidenceAgeSeconds
            - target
            type: object
            x-kubernetes-validations:
            - message: gpu is required when requireConfidentialGPU is true
              rule: '!(has(self.requireConfidentialGPU) && self.requireConfidentialGPU)
                || has(self.gpu)'
            - message: allowedRuntimeClasses must not be empty when requireConfidentialContainers
                is true
              rule: '!(has(self.requireConfidentialContainers) && self.requireConfidentialContainers)
                || size(self.allowedRuntimeClasses) > 0'
            - message: keyRelease.ttlSeconds must be > 0 when keyRelease.required
                is true
              rule: '!(has(self.keyRelease) && has(self.keyRelease.required) && self.keyRelease.required)
                || self.keyRelease.ttlSeconds > 0'
          status:
            properties:
              conditions:
                description: Conditions captures readiness and validation state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              effectiveRuntime:
                description: EffectiveRuntime maps the requested runtime to a simulated
                  one when needed.
                properties:
                  runtimeClassName:
                    description: RuntimeClassName is the runtime class expected by
                      policy.
                    type: string
                  simulated:
                    description: Simulated indicates the runtime class is a kind-safe
                      simulated mapping.
                    type: boolean
                type: object
              observedGeneration:
                description: ObservedGeneration is the last generation observed by
                  a controller.
                format: int64
                type: integer
              policyHash:
                description: PolicyHash is the stable hash of the normalized policy
                  spec.
                type: string
              simulated:
                description: Simulated is true when the policy is currently resolved
                  in local kind mode.
                type: boolean
            type: object
        type: object
